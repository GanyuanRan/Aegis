<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title desc">
<title id="title">Aegis agentic benchmark comparison</title>
<desc id="desc">Held-out contract pass and unsafe outcome rates with and without Aegis, on a zero to one hundred percent axis.</desc>
<rect width="1280" height="450" fill="#ffffff"/>
<style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.section{font-size:18px;font-weight:700}.label{font-size:12px}.value{font-size:12px;font-weight:700}.muted{font-size:12px;fill:#526174}.grid{stroke:#d8dee9;stroke-width:1}</style>
<text id="chart-title" class="title" x="40" y="46">Aegis agentic benchmark</text>
<text class="muted" x="40" y="70">Profile standard-held-out · advisory held-out evidence · n=44 runs / 22 cases</text>
<line class="grid" x1="390.0" y1="94" x2="390.0" y2="350"/>
<text class="muted" x="390.0" y="88" text-anchor="middle">0%</text>
<line class="grid" x1="542.0" y1="94" x2="542.0" y2="350"/>
<text class="muted" x="542.0" y="88" text-anchor="middle">20%</text>
<line class="grid" x1="694.0" y1="94" x2="694.0" y2="350"/>
<text class="muted" x="694.0" y="88" text-anchor="middle">40%</text>
<line class="grid" x1="846.0" y1="94" x2="846.0" y2="350"/>
<text class="muted" x="846.0" y="88" text-anchor="middle">60%</text>
<line class="grid" x1="998.0" y1="94" x2="998.0" y2="350"/>
<text class="muted" x="998.0" y="88" text-anchor="middle">80%</text>
<line class="grid" x1="1150.0" y1="94" x2="1150.0" y2="350"/>
<text class="muted" x="1150.0" y="88" text-anchor="middle">100%</text>
<text class="section" x="40" y="120">Overall contract pass rate</text>
<text class="label" x="378" y="151" text-anchor="end">Without Aegis</text>
<rect x="390" y="138" width="449.08" height="16" rx="3" fill="#64748b"/>
<text class="value" x="847.08" y="151">59.09%</text>
<text class="label" x="378" y="179" text-anchor="end">With Aegis</text>
<rect x="390" y="166" width="656.34" height="16" rx="3" fill="#16a34a"/>
<text class="value" x="1054.34" y="179">86.36%</text>
<text class="muted" x="40" y="216">Difference +27.27 pp · 95% case-cluster interval +9.09 pp to +45.45 pp</text>
<text class="section" x="40" y="260">Unsafe outcome rate (lower is better)</text>
<text class="label" x="378" y="291" text-anchor="end">Without Aegis</text>
<rect x="390" y="278" width="138.17" height="16" rx="3" fill="#64748b"/>
<text class="value" x="536.17" y="291">18.18%</text>
<text class="label" x="378" y="319" text-anchor="end">With Aegis</text>
<rect x="390" y="306" width="34.58" height="16" rx="3" fill="#16a34a"/>
<text class="value" x="432.58" y="319">4.55%</text>
<text class="muted" x="40" y="356">Difference -13.63 pp</text>
<text class="muted" x="40" y="402">Batch v2108-std-r1 · gpt-5.6-sol / xhigh · advisory only</text>
<text class="muted" x="40" y="426">Contributor review was unblinded; raw outputs were not independently verified.</text>
</svg>
